# yaml-language-server: $schema=https://raw.githubusercontent.com/nao1215/atago/main/schema/atago.schema.json
version: "1"

suite:
  name: sqlode cli
  env:
    PROJECT_ROOT: ${env:PROJECT_ROOT}
  setup:
    - run:
        shell: true
        cwd: ${env:PROJECT_ROOT}
        command: gleam export erlang-shipment >/dev/null

defaults:
  run:
    shell: true
    cwd: ${env:PROJECT_ROOT}

scenarios:
  - name: init creates config file and stub files
    steps:
      - run:
          command: |
            rm -rf "${workdir}/init-default"
            ./spec/support/sqlode.sh init --output="${workdir}/init-default/sqlode.yaml"
      - assert:
          exit_code: 0
          stdout:
            contains: Created
          stderr:
            empty: true
      - assert:
          file:
            path: init-default/sqlode.yaml
            exists: true
      - assert:
          dir:
            path: init-default/db
            exists: true
            contains:
              - schema.sql
              - query.sql

  - name: init fails when config file already exists
    steps:
      - fixture:
          file: init-existing/sqlode.yaml
          content: existing
      - run:
          command: ./spec/support/sqlode.sh init --output="${workdir}/init-existing/sqlode.yaml"
      - assert:
          exit_code: 1
          stderr:
            contains: "SQD1006: "

  - name: init scaffolds mysql native runtime
    steps:
      - run:
          command: |
            rm -rf "${workdir}/init-mysql-native"
            ./spec/support/sqlode.sh init \
              --output="${workdir}/init-mysql-native/sqlode.yaml" \
              --engine=mysql \
              --runtime=native
      - assert:
          exit_code: 0
          stdout:
            contains: Created
          stderr:
            empty: true
      - assert:
          file:
            path: init-mysql-native/sqlode.yaml
            contains:
              - 'engine: "mysql"'
              - 'runtime: "native"'
      - assert:
          file:
            path: init-mysql-native/db/schema.sql
            contains: BIGINT AUTO_INCREMENT PRIMARY KEY

  - name: init sqlite stub schema gives created_at a default timestamp
    steps:
      - run:
          command: |
            rm -rf "${workdir}/init-sqlite-default"
            ./spec/support/sqlode.sh init \
              --output="${workdir}/init-sqlite-default/sqlode.yaml" \
              --engine=sqlite
      - assert:
          exit_code: 0
          stdout:
            contains: Created
      - assert:
          file:
            path: init-sqlite-default/db/schema.sql
            contains: created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP

  - name: init mysql stub schema gives created_at a default timestamp
    steps:
      - run:
          command: |
            rm -rf "${workdir}/init-mysql-default"
            ./spec/support/sqlode.sh init \
              --output="${workdir}/init-mysql-default/sqlode.yaml" \
              --engine=mysql
      - assert:
          exit_code: 0
          stdout:
            contains: Created
      - assert:
          file:
            path: init-mysql-default/db/schema.sql
            contains: created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP

  - name: init postgresql stub schema gives created_at a default timestamp
    steps:
      - run:
          command: |
            rm -rf "${workdir}/init-postgresql-default"
            ./spec/support/sqlode.sh init \
              --output="${workdir}/init-postgresql-default/sqlode.yaml" \
              --engine=postgresql
      - assert:
          exit_code: 0
          stdout:
            contains: Created
      - assert:
          file:
            path: init-postgresql-default/db/schema.sql
            contains: created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP

  - name: generate help shows usage
    steps:
      - run:
          command: ./spec/support/sqlode.sh generate --help
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "Command: generate"
              - auto-discover
          stderr:
            empty: true

  - name: generate fails when config file does not exist
    steps:
      - run:
          command: ./spec/support/sqlode.sh generate --config=nonexistent.yaml
      - assert:
          exit_code: 1
          stderr:
            contains: "SQD1103: Config file not found"

  # `--flag value` is as common as `--flag=value`; both must work for
  # every flag that takes a value.
  - name: flags take a value after a space
    steps:
      - run:
          command: |
            rm -rf "${workdir}/space-flags"
            ./spec/support/sqlode.sh init --output "${workdir}/space-flags/sqlode.yaml" --engine sqlite --runtime native
      - assert:
          exit_code: 0
          stderr:
            empty: true
      - assert:
          file:
            path: space-flags/sqlode.yaml
            contains:
              - 'engine: "sqlite"'
              - 'runtime: "native"'
      - run:
          command: ./spec/support/sqlode.sh verify --config "${workdir}/space-flags/sqlode.yaml"
      - assert:
          exit_code: 0
      - run:
          command: ./spec/support/sqlode.sh generate --config "${workdir}/space-flags/sqlode.yaml"
      - assert:
          exit_code: 0
          stdout:
            contains: Successfully generated
      - run:
          command: ./spec/support/sqlode.sh generate --config
      - assert:
          exit_code: 1
          stderr:
            contains: "error: SQD1004: "

  - name: generate fails with invalid config
    steps:
      - run:
          command: ./spec/support/sqlode.sh generate --config=test/fixtures/malformed.yaml
      - assert:
          exit_code: 1
          stderr:
            contains: Error

  - name: generate creates params queries and models from sqlc-style input
    steps:
      - run:
          command: |
            rm -rf "${workdir}/generate-basic"
            mkdir -p "${workdir}/generate-basic"
            cp test/fixtures/schema.sql "${workdir}/generate-basic/schema.sql"
            cp test/fixtures/query.sql "${workdir}/generate-basic/query.sql"
      - fixture:
          file: generate-basic/sqlode.yaml
          content: |
            version: "2"
            sql:
              - schema: "schema.sql"
                queries: "query.sql"
                engine: "postgresql"
                gen:
                  gleam:
                    out: "src/db"
                    runtime: "raw"
      - run:
          command: ./spec/support/sqlode.sh generate --config="${workdir}/generate-basic/sqlode.yaml"
      - assert:
          exit_code: 0
          stdout:
            contains: Successfully generated 3 files
          stderr:
            empty: true
      - assert:
          dir:
            path: generate-basic/src/db
            exists: true
            contains:
              - params.gleam
              - queries.gleam
              - models.gleam
      - assert:
          file:
            path: generate-basic/src/db/params.gleam
            contains:
              - "GetAuthorParams(id: Int)"
              - runtime.int(params.id)
      - assert:
          file:
            path: generate-basic/src/db/queries.gleam
            contains:
              - "pub fn get_author() -> runtime.RawQuery(params.GetAuthorParams) {"
              - "pub fn list_authors() -> runtime.RawQuery(Nil) {"
      - assert:
          file:
            path: generate-basic/src/db/models.gleam
            contains:
              - "pub type GetAuthorRow {"
              - "pub type ListAuthorsRow {"

  - name: generate autodiscovery fails with a helpful message when no config exists
    steps:
      - run:
          command: |
            rm -rf "${workdir}/autodiscover-empty"
            mkdir -p "${workdir}/autodiscover-empty"
      - run:
          cwd: ${workdir}/autodiscover-empty
          command: '"$PROJECT_ROOT/spec/support/sqlode.sh" generate'
      - assert:
          exit_code: 1
          stderr:
            contains:
              - No config file found
              - sqlode.yaml
              - sqlc.json

  - name: generate autodiscovery picks up sqlode.yaml
    steps:
      - run:
          command: |
            rm -rf "${workdir}/autodiscover-sqlode"
            mkdir -p "${workdir}/autodiscover-sqlode"
            cp test/fixtures/schema.sql "${workdir}/autodiscover-sqlode/schema.sql"
            cp test/fixtures/query.sql "${workdir}/autodiscover-sqlode/query.sql"
      - fixture:
          file: autodiscover-sqlode/sqlode.yaml
          content: |
            version: "2"
            sql:
              - schema: "schema.sql"
                queries: "query.sql"
                engine: "postgresql"
                gen:
                  gleam:
                    out: "src/db"
                    runtime: "raw"
      - run:
          cwd: ${workdir}/autodiscover-sqlode
          command: '"$PROJECT_ROOT/spec/support/sqlode.sh" generate'
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "Loading config from: sqlode.yaml"
              - Successfully generated
          stderr:
            empty: true
      - assert:
          dir:
            path: autodiscover-sqlode/src/db
            exists: true
            contains:
              - params.gleam
              - queries.gleam
              - models.gleam

  - name: generate autodiscovery falls back to sqlc.yaml
    steps:
      - run:
          command: |
            rm -rf "${workdir}/autodiscover-sqlc-yaml"
            mkdir -p "${workdir}/autodiscover-sqlc-yaml"
            cp test/fixtures/schema.sql "${workdir}/autodiscover-sqlc-yaml/schema.sql"
            cp test/fixtures/query.sql "${workdir}/autodiscover-sqlc-yaml/query.sql"
      - fixture:
          file: autodiscover-sqlc-yaml/sqlc.yaml
          content: |
            version: "2"
            sql:
              - schema: "schema.sql"
                queries: "query.sql"
                engine: "postgresql"
                gen:
                  gleam:
                    out: "src/db"
                    runtime: "raw"
      - run:
          cwd: ${workdir}/autodiscover-sqlc-yaml
          command: '"$PROJECT_ROOT/spec/support/sqlode.sh" generate'
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "Loading config from: sqlc.yaml"
              - Successfully generated
          stderr:
            empty: true

  - name: generate autodiscovery falls back to sqlc.json
    steps:
      - run:
          command: |
            rm -rf "${workdir}/autodiscover-sqlc-json"
            mkdir -p "${workdir}/autodiscover-sqlc-json"
            cp test/fixtures/schema.sql "${workdir}/autodiscover-sqlc-json/schema.sql"
            cp test/fixtures/query.sql "${workdir}/autodiscover-sqlc-json/query.sql"
      - fixture:
          file: autodiscover-sqlc-json/sqlc.json
          content: |
            {
              "version": "2",
              "sql": [
                {
                  "schema": "schema.sql",
                  "queries": "query.sql",
                  "engine": "postgresql",
                  "gen": {
                    "gleam": {
                      "out": "src/db",
                      "runtime": "raw"
                    }
                  }
                }
              ]
            }
      - run:
          cwd: ${workdir}/autodiscover-sqlc-json
          command: '"$PROJECT_ROOT/spec/support/sqlode.sh" generate'
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "Loading config from: sqlc.json"
              - Successfully generated
          stderr:
            empty: true

  - name: generate autodiscovery refuses to pick when multiple candidates exist
    steps:
      - run:
          command: |
            rm -rf "${workdir}/autodiscover-multiple"
            mkdir -p "${workdir}/autodiscover-multiple"
            cp test/fixtures/schema.sql "${workdir}/autodiscover-multiple/schema.sql"
            cp test/fixtures/query.sql "${workdir}/autodiscover-multiple/query.sql"
      - fixture:
          file: autodiscover-multiple/sqlode.yaml
          content: |
            version: "2"
            sql:
              - schema: "schema.sql"
                queries: "query.sql"
                engine: "postgresql"
                gen:
                  gleam:
                    out: "src/db"
                    runtime: "raw"
      - fixture:
          file: autodiscover-multiple/sqlc.yaml
          content: |
            version: "2"
            sql:
              - schema: "schema.sql"
                queries: "query.sql"
                engine: "postgresql"
                gen:
                  gleam:
                    out: "src/db"
                    runtime: "raw"
      - run:
          cwd: ${workdir}/autodiscover-multiple
          command: '"$PROJECT_ROOT/spec/support/sqlode.sh" generate'
      - assert:
          exit_code: 1
          stderr:
            contains:
              - Multiple config files found
              - sqlode.yaml
              - sqlc.yaml

  - name: verify fails when config file does not exist
    steps:
      - run:
          command: ./spec/support/sqlode.sh verify --config=nonexistent.yaml
      - assert:
          exit_code: 1
          stderr:
            contains: "SQD1103: Config file not found"

  - name: verify fails with invalid config
    steps:
      - run:
          command: ./spec/support/sqlode.sh verify --config=test/fixtures/malformed.yaml
      - assert:
          exit_code: 1
          stderr:
            contains: Error

  - name: version prints the version string
    steps:
      - run:
          command: ./spec/support/sqlode.sh version
      - assert:
          exit_code: 0
          stdout:
            contains: sqlode v
          stderr:
            empty: true

  - name: init help shows usage
    steps:
      - run:
          command: ./spec/support/sqlode.sh init --help
      - assert:
          exit_code: 0
          stdout:
            contains: Scaffold a sqlode.yaml
          stderr:
            empty: true

  - name: version help shows usage
    steps:
      - run:
          command: ./spec/support/sqlode.sh version --help
      - assert:
          exit_code: 0
          stdout:
            contains: Print the sqlode version
          stderr:
            empty: true

  - name: example sqlite-basic stays fresh
    steps:
      - run:
          command: |
            rm -rf "${workdir}/sqlite-basic"
            cp -R examples/sqlite-basic "${workdir}/sqlite-basic"
            rm -rf "${workdir}/sqlite-basic/src/db"
      - run:
          command: ./spec/support/sqlode.sh generate --config="${workdir}/sqlite-basic/sqlode.yaml"
      - assert:
          exit_code: 0
          stdout:
            contains: Successfully generated
          stderr:
            empty: true
      - assert:
          dir:
            path: sqlite-basic/src/db
            exists: true
            contains:
              - params.gleam
              - models.gleam
              - queries.gleam
              - sqlight_adapter.gleam
      - assert:
          file:
            path: sqlite-basic/src/db/params.gleam
            contains:
              - "GetAuthorParams(id: Int)"
              - "CreateAuthorParams(name: String"
      - assert:
          file:
            path: sqlite-basic/src/db/sqlight_adapter.gleam
            contains:
              - "pub fn get_author("
              - "pub fn list_authors("
              - "pub fn create_author("
              - "pub fn delete_author("

  - name: invalid invocations keep diagnostics on stderr
    steps:
      - run:
          command: ./spec/support/sqlode.sh --xyz
      - assert:
          exit_code: 1
          stdout:
            not_contains: "error:"
          stderr:
            contains: "error: SQD1003: "
      - run:
          command: ./spec/support/sqlode.sh
      - assert:
          exit_code: 1
          stdout:
            not_contains: "error:"
          stderr:
            contains: "error: SQD1001: "

  - name: help text stays on stdout
    steps:
      - run:
          command: ./spec/support/sqlode.sh --help
      - assert:
          exit_code: 0
          stdout:
            contains: sqlode
      - assert:
          stderr:
            not_contains: "error: failed"

  # The escript attached to the GitHub Release and copied into the Docker
  # image is built by scripts/build_escript.sh. It must carry sqlode and its
  # runtime dependencies only: no test modules and no dev-dependencies.
  - name: the release escript packs only sqlode and its runtime dependencies
    steps:
      - run:
          command: ./scripts/build_escript.sh "${workdir}/bin/sqlode"
      - assert:
          exit_code: 0
      - run:
          command: escript scripts/escript.erl list "${workdir}/bin/sqlode"
      - assert:
          exit_code: 0
          stdout:
            contains:
              - sqlode.app
              - sqlode_escript_main.beam
              - yamerl.app
              - glint.app
            not_contains:
              - _test.beam
              - gleeunit
              - glinter
              - metamon
              - gleescript
      - run:
          command: '"${workdir}/bin/sqlode" version'
      - assert:
          exit_code: 0
          stdout:
            contains: sqlode
      - run:
          command: '"${workdir}/bin/sqlode" generate --config="${workdir}/missing.yaml"'
      - assert:
          exit_code: 1
          stderr:
            contains: "SQD1103: Config file not found"

  # The README Quickstart shows the sqlode.yaml that `init` writes. A key
  # the config loader rejects (it once showed `package:`) stops a reader
  # who copies it at the first generate.
  - name: README quickstart config is what init writes
    steps:
      - run:
          command: |
            rm -rf "${workdir}/quickstart"
            ./spec/support/sqlode.sh init --engine=sqlite --runtime=native --output="${workdir}/quickstart/sqlode.yaml"
            awk '/^## Quickstart/{q=1} q&&/^```yaml/{f=1;next} f&&/^```/{exit} f' README.md > "${workdir}/readme.yaml"
            diff "${workdir}/readme.yaml" "${workdir}/quickstart/sqlode.yaml"
      - assert:
          exit_code: 0
      - run:
          command: ./spec/support/sqlode.sh generate --config="${workdir}/quickstart/sqlode.yaml"
      - assert:
          exit_code: 0
          stdout:
            contains: Successfully generated

  # README recommends `sqlode verify` as a CI gate before generate. It has
  # to pass on a project that generates, and fail with exit 1 once the
  # schema drops a column that queries still select, reporting every
  # broken query (not only the first) with the query and the column. generate must stop the same way without touching the files
  # it wrote before.
  - name: verify gates a schema change that breaks a query
    steps:
      - run:
          command: |
            rm -rf "${workdir}/gate"
            mkdir -p "${workdir}/gate/db"
            printf 'CREATE TABLE authors (\n  id INTEGER PRIMARY KEY,\n  name TEXT NOT NULL\n);\n' > "${workdir}/gate/db/schema.sql"
            printf -- '-- name: GetAuthor :one\nSELECT id, name FROM authors WHERE id = ?;\n\n-- name: ListNames :many\nSELECT name FROM authors ORDER BY name;\n' > "${workdir}/gate/db/query.sql"
            printf 'version: "2"\nsql:\n  - schema: "db/schema.sql"\n    queries: "db/query.sql"\n    engine: "sqlite"\n    gen:\n      gleam:\n        out: "src/db"\n        runtime: "native"\n' > "${workdir}/gate/sqlode.yaml"
            ./spec/support/sqlode.sh verify --config="${workdir}/gate/sqlode.yaml"
      - assert:
          exit_code: 0
          stdout:
            contains: All checks passed.
      - run:
          command: |
            ./spec/support/sqlode.sh generate --config="${workdir}/gate/sqlode.yaml" > /dev/null
            cat "${workdir}/gate/src/db/"*.gleam | cksum > "${workdir}/gate/before.cksum"
            printf 'CREATE TABLE authors (\n  id INTEGER PRIMARY KEY,\n  full_name TEXT NOT NULL\n);\n' > "${workdir}/gate/db/schema.sql"
            ./spec/support/sqlode.sh verify --config="${workdir}/gate/sqlode.yaml"
      - assert:
          exit_code: 1
          stdout:
            contains:
              - 'SQD4002: Query "GetAuthor"'
              - 'SQD4002: Query "ListNames"'
              - column "name" not found in table "authors"
            not_contains: CAST
      - run:
          command: ./spec/support/sqlode.sh generate --config="${workdir}/gate/sqlode.yaml"
      - assert:
          exit_code: 1
          stderr:
            contains: 'Error: SQD4002: Query "GetAuthor": column "name" not found in table "authors"'
      - run:
          command: |
            cat "${workdir}/gate/src/db/"*.gleam | cksum > "${workdir}/gate/after.cksum"
            cmp "${workdir}/gate/before.cksum" "${workdir}/gate/after.cksum"
      - assert:
          exit_code: 0
