name: Integration

on:
  push:
    branches: [main]
  workflow_dispatch:

# Run release-path integration tests on main so tag-time failures surface
# immediately on merge, not at release time. PRs are intentionally excluded
# to preserve the Actions usage budget; the lightweight unit test suite in
# ci.yml still runs on every PR.

# Read-only Hex key for dependency resolution; see the note in ci.yml.
permissions:
  contents: read

env:
  HEXPM_READ_API_KEY: ${{ secrets.HEXPM_READ_API_KEY }}

jobs:
  integration:
    name: Release-path integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same toolchain as the `build` job in release.yml, which runs the
      # same integration tests before building the release escript.
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "27"
          gleam-version: "1.x"
          rebar3-version: "3"

      - name: Download dependencies
        run: gleam deps download

      - name: Run integration tests
        run: bash integration_test/run.sh
