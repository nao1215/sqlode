name: nightly-property

# The property tests (metamon) run 100 times their usual count every night,
# the Gleam counterpart of the nightly fuzzing the Go repositories run: twenty
# passes of the suite, each with METAMON_RUNS_MULTIPLIER=5. A single pass at
# 100x would hit the per-test time limit; at 10x the slowest metamorphic test
# already came within a few seconds of it, so the passes are kept short and
# more numerous. Each draws a new random seed, so together they cover as many
# inputs. Pull requests keep the normal count so they stay fast. A failure
# report prints its seed, so the case can be reproduced with
# Config(..default_config(), seed: Some(seed)) and kept as a regression test.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  property:
    name: property tests x5, twenty passes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          gleam-version: "1.x"
          rebar3-version: "3"

      - name: Download dependencies
        run: gleam deps download

      - name: Property tests, twenty passes at 5 times the runs
        env:
          METAMON_RUNS_MULTIPLIER: "5"
        run: |
          set -e
          for pass in $(seq 1 20); do
            echo "::group::pass $pass"
            gleam test
            echo "::endgroup::"
          done
