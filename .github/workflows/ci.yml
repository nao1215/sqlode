name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Two compiler lanes:
# - Latest lane (`all`, `e2e-integration`, `build-javascript`): Gleam
#   floats on 1.x with the newest OTP, so new compiler warnings and
#   deprecations surface here first. Format, lint, warnings-as-errors, E2E
#   and the database integration tests only run here. The atago
#   integration suite has its own job so it runs beside `all`.
# - Floor lane (`test-floor`): the `gleam` requirement in gleam.toml on the
#   oldest maintained OTP. Keep its Gleam version in sync with gleam.toml,
#   otherwise the declared floor is no longer verified.

# The integration tests resolve dependencies for freshly generated projects many
# times per run. Unauthenticated Hex API calls share a per-IP rate limit, which
# GitHub-hosted runners can exceed; integration_test/lib.sh waits and retries
# when that happens, and a read-only key moves the calls to the per-key limit.
# An unset secret expands to an empty value, which Gleam treats as no key.
permissions:
  contents: read

# A new push to a pull request cancels the run of the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HEXPM_READ_API_KEY: ${{ secrets.HEXPM_READ_API_KEY }}

jobs:
  all:
    name: All checks (Gleam 1.x, OTP 29)
    # This integration job uses the MySQL server bundled in the 24.04 image;
    # ubuntu-26.04 no longer ships MySQL, so renovate.json holds this pin.
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sqlode_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          gleam-version: "1.x"
          rebar3-version: "3"

      - uses: nao1215/setup-atago@5dca90fe652651408ccd1c2aee030767484482a9 # v0.1.5
        with:
          version: v0.26.3

      # Hex packages and the downloaded sources, keyed on the lockfile.
      # Restored on every run, saved from main only.
      - name: Restore Gleam dependency cache
        id: gleam-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/gleam
            build/packages
          key: gleam-${{ runner.os }}-${{ github.job }}-${{ hashFiles('manifest.toml', 'integration_test/warmup/manifest.toml') }}
          restore-keys: gleam-${{ runner.os }}-${{ github.job }}-

      - name: Download dependencies
        run: gleam deps download

      - name: Format check
        run: gleam format --check src/ test/

      - name: Type check
        run: gleam check

      - name: Build (warnings as errors)
        run: gleam build --warnings-as-errors

      - name: Lint (glinter, warnings as errors)
        run: gleam run -m glinter

      # After editing any workflow, regenerate actions.lock with
      # `python3 .github/scripts/lock_actions.py` (needs
      # `gh extension install github/gh-actions-lock --pin v0.4.1`).
      - name: Verify workflow lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          python3 .github/scripts/lock_actions.py --check
          gh actions-lock --verify

      - name: Unit tests
        run: gleam test

      # sqlode's analysis of the SQLite fixtures against SQLite itself
      # (Python's sqlite3 on the runner). See doc/testing.md.
      - name: Differential test against SQLite
        run: python3 scripts/differential_sqlite.py

      # spec/integration.atago.yaml, the slowest suite, runs in the
      # e2e-integration job beside this one.
      - name: atago E2E tests (CLI)
        env:
          PROJECT_ROOT: ${{ github.workspace }}
        run: atago run --ci --report gha --parallel 1 ./spec/cli.atago.yaml

      # The suite above drives the erlang-shipment. Users run the escript
      # attached to the release (and baked into the Docker image), which
      # starts and stops the runtime differently, so the CLI contract is
      # checked on that file too.
      - name: Build escript binary
        run: sh scripts/build_escript.sh sqlode

      - name: atago E2E tests (escript)
        env:
          PROJECT_ROOT: ${{ github.workspace }}
          SQLODE_BIN: ${{ github.workspace }}/sqlode
        run: atago run --ci --report gha --parallel 1 ./spec/cli.atago.yaml

      - name: PostgreSQL integration test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/sqlode_integration
        run: sh integration_test/run.sh case_postgresql_real

      # Use the MySQL that ships with the GitHub-hosted ubuntu runner
      # rather than a docker service container — the same approach
      # shork itself uses in its CI. The runner-bundled root account
      # uses `mysql_native_password`, which avoids the
      # caching_sha2_password handshake friction that mysql_otp 1.9
      # (the Erlang library underneath shork) hits with a fresh
      # mysql:8.0 container.
      - name: Set up MySQL
        run: |
          sudo /etc/init.d/mysql start
          mysql -e 'CREATE DATABASE sqlode_integration;' -uroot -proot

      - name: MySQL integration test
        env:
          MYSQL_URL: mysql://root:root@localhost:3306/sqlode_integration
        run: sh integration_test/run.sh case_mysql_real

      - name: Save Gleam dependency cache
        if: ${{ github.ref == 'refs/heads/main' && steps.gleam-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/gleam
            build/packages
          key: ${{ steps.gleam-cache.outputs.cache-primary-key }}

  e2e-integration:
    # spec/integration.atago.yaml generates code into temporary Gleam
    # projects and builds and tests them. It took two thirds of the
    # `all` job, so it runs here in parallel with it, on the same
    # toolchain.
    name: atago E2E integration (Gleam 1.x, OTP 29)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          gleam-version: "1.x"
          rebar3-version: "3"

      - uses: nao1215/setup-atago@5dca90fe652651408ccd1c2aee030767484482a9 # v0.1.5
        with:
          version: v0.26.3

      # Hex packages and the downloaded sources, keyed on the lockfile.
      # Restored on every run, saved from main only.
      - name: Restore Gleam dependency cache
        id: gleam-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/gleam
            build/packages
          key: gleam-${{ runner.os }}-${{ github.job }}-${{ hashFiles('manifest.toml', 'integration_test/warmup/manifest.toml') }}
          restore-keys: gleam-${{ runner.os }}-${{ github.job }}-

      - name: Download dependencies
        run: gleam deps download

      - name: Prepare integration dependency cache
        run: cd integration_test/warmup && gleam deps download

      - name: atago E2E tests (integration)
        env:
          PROJECT_ROOT: ${{ github.workspace }}
        run: atago run --ci --report gha --parallel 1 ./spec/integration.atago.yaml

      - name: Save Gleam dependency cache
        if: ${{ github.ref == 'refs/heads/main' && steps.gleam-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/gleam
            build/packages
          key: ${{ steps.gleam-cache.outputs.cache-primary-key }}

  test-floor:
    # No --warnings-as-errors here: an old compiler's warnings cannot
    # always be fixed without breaking the latest lane.
    name: Unit tests (Gleam 1.14.0, OTP 27)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "27"
          gleam-version: "1.14.0"
          rebar3-version: "3"
      - name: Restore Gleam dependency cache
        id: gleam-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/gleam
            build/packages
          key: gleam-${{ runner.os }}-${{ github.job }}-${{ hashFiles('manifest.toml', 'integration_test/warmup/manifest.toml') }}
          restore-keys: gleam-${{ runner.os }}-${{ github.job }}-
      - run: gleam deps download
      - run: gleam build
      - run: gleam test
      - name: Save Gleam dependency cache
        if: ${{ github.ref == 'refs/heads/main' && steps.gleam-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/gleam
            build/packages
          key: ${{ steps.gleam-cache.outputs.cache-primary-key }}

  build-javascript:
    name: Build (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          gleam-version: "1.x"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Restore Gleam dependency cache
        id: gleam-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/gleam
            build/packages
          key: gleam-${{ runner.os }}-${{ github.job }}-${{ hashFiles('manifest.toml', 'integration_test/warmup/manifest.toml') }}
          restore-keys: gleam-${{ runner.os }}-${{ github.job }}-
      - run: gleam deps download
      - run: gleam build --target javascript
      # Run the cross-target runtime laws on Node so JavaScript-target
      # regressions in placeholder / slice expansion or Value encoding
      # are caught here (#527). The dedicated entry point exists
      # because gleeunit's JavaScript auto-discovery would otherwise
      # transitively load `glint`, whose generated JavaScript fails to
      # parse on Node — see test/sqlode_js_test.gleam for the full
      # rationale.
      - name: Runtime tests (JavaScript)
        run: gleam run -m sqlode_js_test --target javascript
      - name: Save Gleam dependency cache
        if: ${{ github.ref == 'refs/heads/main' && steps.gleam-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/gleam
            build/packages
          key: ${{ steps.gleam-cache.outputs.cache-primary-key }}
