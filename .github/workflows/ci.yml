name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Two compiler lanes:
# - Latest lane (`all`, `build-javascript`): Gleam floats on 1.x with the
#   newest OTP, so new compiler warnings and deprecations surface here
#   first. Format, lint, warnings-as-errors, E2E and the database
#   integration tests only run here.
# - Floor lane (`test-floor`): the `gleam` requirement in gleam.toml on the
#   oldest maintained OTP. Keep its Gleam version in sync with gleam.toml,
#   otherwise the declared floor is no longer verified.

jobs:
  all:
    name: All checks (Gleam 1.x, OTP 29)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sqlode_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.x"
          rebar3-version: "3"

      - uses: nao1215/setup-atago@v0
        with:
          version: v0.21.0

      - name: Download dependencies
        run: gleam deps download

      - name: Format check
        run: gleam format --check src/ test/

      - name: Type check
        run: gleam check

      - name: Build (warnings as errors)
        run: gleam build --warnings-as-errors

      - name: Lint (glinter, warnings as errors)
        run: gleam run -m glinter

      - name: Unit tests
        run: gleam test

      - name: Prepare integration dependency cache
        run: cd integration_test/warmup && gleam deps download

      - name: atago E2E tests
        env:
          PROJECT_ROOT: ${{ github.workspace }}
        run: atago run --ci --report gha --parallel 1 ./spec

      - name: PostgreSQL integration test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/sqlode_integration
        run: sh integration_test/run.sh case_postgresql_real

      # Use the MySQL that ships with the GitHub-hosted ubuntu runner
      # rather than a docker service container — the same approach
      # shork itself uses in its CI. The runner-bundled root account
      # uses `mysql_native_password`, which avoids the
      # caching_sha2_password handshake friction that mysql_otp 1.9
      # (the Erlang library underneath shork) hits with a fresh
      # mysql:8.0 container.
      - name: Set up MySQL
        run: |
          sudo /etc/init.d/mysql start
          mysql -e 'CREATE DATABASE sqlode_integration;' -uroot -proot

      - name: MySQL integration test
        env:
          MYSQL_URL: mysql://root:root@localhost:3306/sqlode_integration
        run: sh integration_test/run.sh case_mysql_real

  test-floor:
    # No --warnings-as-errors here: an old compiler's warnings cannot
    # always be fixed without breaking the latest lane.
    name: Unit tests (Gleam 1.14.0, OTP 27)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.14.0"
          rebar3-version: "3"
      - run: gleam deps download
      - run: gleam build
      - run: gleam test

  build-javascript:
    name: Build (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.x"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: gleam deps download
      - run: gleam build --target javascript
      # Run the cross-target runtime laws on Node so JavaScript-target
      # regressions in placeholder / slice expansion or Value encoding
      # are caught here (#527). The dedicated entry point exists
      # because gleeunit's JavaScript auto-discovery would otherwise
      # transitively load `glint`, whose generated JavaScript fails to
      # parse on Node — see test/sqlode_js_test.gleam for the full
      # rationale.
      - name: Runtime tests (JavaScript)
        run: gleam run -m sqlode_js_test --target javascript
