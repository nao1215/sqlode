# yaml-language-server: $schema=https://raw.githubusercontent.com/nao1215/himorime/main/schema/himorime.schema.json
#
# sqlode measured end to end with himorime (https://github.com/nao1215/himorime):
# the escript a user starts, from the first instruction of the BEAM to its exit.
#
#   just bench          measure the working tree
#   just bench-compare  compare main with the working tree
#
# On a pull request, .github/workflows/bench.yml runs `himorime ci bench`:
# the base of the pull request and its head are built and measured in
# interleaved rounds on the same runner. See bench/README.md.
#
# Inputs are generated by gen.sh before measuring. Both revisions run the
# working tree's gen.sh (${head_root}), so they read the same bytes.
#
# The number in a benchmark name is the number of queries in the project:
# 10, where starting the BEAM dominates, and 1k, where parsing, analysing and
# generating do. generate runs `gleam format` on what it writes, so gleam
# must be on PATH; that child process is part of what is measured, as it is
# for a user.
version: "1"

name: sqlode
description: Start-up, generate and verify of the sqlode escript on SQLite projects of 10 and 1000 queries, and a failing generate.

# The escript is what users download from the GitHub Release and what the
# Docker image runs (release.yml and the Dockerfile build it the same way).
# gleescript packs the BEAM files under build/, so sqlode itself is compiled
# first; `gleam run -m gleescript` alone compiles only the dependencies.
build:
  command:
    - sh
    - -c
    - |
      set -e
      gleam build
      gleam run -m gleescript -- --out=build/himorime
      cp build/himorime/sqlode "$1"
    - sh
    - "${artifact}"
  cwd: ..

defaults:
  warmup: 2
  runs: 20
  metrics:
    cpu: true
    memory: true
  regression:
    confidence: 0.95
    latency:
      max_percent: 10
      min_difference: 1ms
    cpu_total:
      max_percent: 15
      min_difference: 2ms
    peak_rss:
      max_percent: 15
      min_difference: 2MiB

benchmarks:
  - name: version
    description: Starting the sqlode escript on the BEAM and exiting.
    tags: [smoke]
    commands:
      sqlode:
        command: ["${artifact}", version]

  - name: generate 10
    description: >-
      Gleam code generated from 10 queries over one pair of tables and
      formatted with gleam format. The output directory is removed before
      every run, outside the measured time, so every run writes every file.
    tags: [smoke]
    setup:
      - command: [sh, "${head_root}/gen.sh", project, "10", "${workdir}/p10"]
    prepare_each:
      - command: [rm, -rf, "${workdir}/p10/src"]
    commands:
      sqlode:
        command: ["${artifact}", generate, "--config=${workdir}/p10/sqlode.yaml"]

  - name: generate 1k
    description: The same on 1000 queries over 100 pairs of tables, where parsing, analysis and code generation dominate.
    tags: [large]
    setup:
      - command: [sh, "${head_root}/gen.sh", project, "1000", "${workdir}/p1k"]
    prepare_each:
      - command: [rm, -rf, "${workdir}/p1k/src"]
    metrics:
      throughput:
        work: {value: 1000, unit: queries}
    commands:
      sqlode:
        command: ["${artifact}", generate, "--config=${workdir}/p1k/sqlode.yaml"]

  - name: verify 1k
    description: sqlode verify on the same 1000 queries, the check a CI job runs before generate. It writes nothing.
    tags: [large]
    setup:
      - command: [sh, "${head_root}/gen.sh", project, "1000", "${workdir}/v1k"]
    metrics:
      throughput:
        work: {value: 1000, unit: queries}
    commands:
      sqlode:
        command: ["${artifact}", verify, "--config=${workdir}/v1k/sqlode.yaml"]

  - name: generate error
    description: generate with a config file that does not exist, which fails with exit 1.
    tags: [smoke]
    exit_codes: [1]
    commands:
      sqlode:
        command: ["${artifact}", generate, "--config=${workdir}/missing.yaml"]
